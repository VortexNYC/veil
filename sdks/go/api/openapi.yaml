          description: "80-byte box.SealAnonymous ciphertext of the org master, base64."
          format: byte
          type: string
        wrap_pubkey_epoch:
          description: Share wrap epoch; bumps on every completed recovery.
          type: integer
        org_key_version:
          description: Org master version the share wraps.
          type: integer
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - enrolled
      - org_key_version
      - wrap_pubkey_epoch
    RecoveryRequest:
      additionalProperties: false
      description: "One initiator -> confirmer recovery ceremony row (VEIL-78). Owner\
        \ callers also see human_email, current_epoch, and confirmer_wrapped_master\
        \ (the caller's own share blob for the proof_hmac fast path); the initiator/target\
        \ member sees the bare row."
      example:
        id: id
        org_id: org_id
        human_id: human_id
        initiated_by: initiated_by
        new_pubkey: new_pubkey
        reset_mfa: true
        status: open
        created_at: 2000-01-23T04:56:07.000+00:00
        unlock_at: 2000-01-23T04:56:07.000+00:00
        expires_at: 2000-01-23T04:56:07.000+00:00
        resolved_at: 2000-01-23T04:56:07.000+00:00
        confirmed_by: confirmed_by
        result_epoch: 0
        human_email: human_email
        current_epoch: 6
        confirmer_wrapped_master: confirmer_wrapped_master
      properties:
        id:
          type: string
        org_id:
          type: string
        human_id:
          description: The member being recovered.
          type: string
        initiated_by:
          description: Who filed the request — the member (self) or an owner.
          type: string
        new_pubkey:
          description: "Staged 32-byte X25519 public key, base64."
          format: byte
          type: string
        reset_mfa:
          description: "On completion, wipe the member's Kratos totp/webauthn and\
            \ mail a re-enrollment link to their address."
          type: boolean
        status:
          enum:
          - open
          - completed
          - denied
          - expired
          - cancelled
          type: string
        created_at:
          format: date-time
          type: string
        unlock_at:
          description: Immediate for owner-confirmed paths; created_at+24h for sole-owner
            self-recovery.
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        resolved_at:
          format: date-time
          type: string
        confirmed_by:
          type: string
        result_epoch:
          description: The member's new wrap_pubkey_epoch after completion.
          type: integer
        human_email:
          description: Owner view only — the member's resolved Kratos address.
          type: string
        current_epoch:
          description: Owner view only — the member's current wrap_pubkey_epoch.
          type: integer
        confirmer_wrapped_master:
          description: Owner view only — the caller's own wrapped share (80B base64)
            for computing proof_hmac locally.
          format: byte
          type: string
      required:
      - created_at
      - current_epoch
      - expires_at
      - human_id
      - id
      - initiated_by
      - new_pubkey
      - org_id
      - reset_mfa
      - status
      - unlock_at
    RecoveriesResponse:
      additionalProperties: false
      example:
        requests:
        - id: id
          org_id: org_id
          human_id: human_id
          initiated_by: initiated_by
          new_pubkey: new_pubkey
          reset_mfa: true
          status: open
          created_at: 2000-01-23T04:56:07.000+00:00
          unlock_at: 2000-01-23T04:56:07.000+00:00
          expires_at: 2000-01-23T04:56:07.000+00:00
          resolved_at: 2000-01-23T04:56:07.000+00:00
          confirmed_by: confirmed_by
          result_epoch: 0
          human_email: human_email
          current_epoch: 6
          confirmer_wrapped_master: confirmer_wrapped_master
        - id: id
          org_id: org_id
          human_id: human_id
          initiated_by: initiated_by
          new_pubkey: new_pubkey
          reset_mfa: true
          status: open
          created_at: 2000-01-23T04:56:07.000+00:00
          unlock_at: 2000-01-23T04:56:07.000+00:00
          expires_at: 2000-01-23T04:56:07.000+00:00
          resolved_at: 2000-01-23T04:56:07.000+00:00
          confirmed_by: confirmed_by
          result_epoch: 0
          human_email: human_email
          current_epoch: 6
          confirmer_wrapped_master: confirmer_wrapped_master
      properties:
        requests:
          items:
            $ref: "#/components/schemas/RecoveryRequest"
          type: array
          default: null
      required:
      - requests
    EnrollRequest:
      additionalProperties: false
      example:
        pubkey: pubkey
      properties:
        pubkey:
          description: "Member's 32-byte X25519 public key, base64 or hex."
          type: string
      required:
      - pubkey
    StartRecoveryRequest:
      additionalProperties: false
      example:
        human_id: human_id
        new_pubkey: new_pubkey
        reset_mfa: true
      properties:
        human_id:
          description: Omit for self-recovery; set for owner-initiated recovery of
            a member.
          type: string
        new_pubkey:
          description: "Staged 32-byte X25519 public key, base64 or hex. Must not\
            \ match any enrolled share pubkey."
          type: string
        reset_mfa:
          description: Also wipe the member's Kratos second factors on completion.
          type: boolean
      required:
      - new_pubkey
    CompleteRecoveryRequest:
      additionalProperties: false
      example:
        proof_hmac: proof_hmac
      properties:
        proof_hmac:
          description: "hex(HMAC-SHA256(org master, request id)) — the sole-owner\
            \ fast path that bypasses the 24h timelock."
          type: string
    StartRecoveryResponse:
      additionalProperties: false
      example:
        request:
          id: id
          org_id: org_id
          human_id: human_id
          initiated_by: initiated_by
          new_pubkey: new_pubkey
          reset_mfa: true
          status: open
          created_at: 2000-01-23T04:56:07.000+00:00
          unlock_at: 2000-01-23T04:56:07.000+00:00
          expires_at: 2000-01-23T04:56:07.000+00:00
          resolved_at: 2000-01-23T04:56:07.000+00:00
          confirmed_by: confirmed_by
          result_epoch: 0
          human_email: human_email
          current_epoch: 6
          confirmer_wrapped_master: confirmer_wrapped_master
        created: true
      properties:
        request:
