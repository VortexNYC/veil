openapi: 3.1.0
info:
  description: "Agent credential broker. Use injects the secret at the edge. Responses\
    \ never include vault material. CLI, MCP, and generated SDKs are projections of\
    \ this contract."
  title: Veil
  version: 0.1.1
servers:
- url: https://veil.nyc
security:
- bearerAuth: []
tags:
- description: Bearer is the agent. listItems is metadata. useItem injects. Never
    GetSecret.
  name: Agent
- description: "Bearer is a Keto member human. Create items and grants. Secret may\
    \ be sent, never returned."
  name: Owner
- description: Bearer is a verified human ID token. Pre-membership — provision creates
    the membership.
  name: Human
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: ok
      security: []
      summary: Liveness. No secrets.
      tags:
      - Agent
  /openapi.json:
    get:
      operationId: getOpenApi
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OpenAPI document
      security: []
      summary: This contract.
      tags:
      - Agent
  /v1/items:
    get:
      operationId: listItems
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemsResponse"
          description: Items
        "401":
          description: missing or invalid Bearer
      summary: "Items this principal may see. Agent: granted. Human owner: the org.\
        \ Human member: granted. Names and URIs. Never secrets."
      tags:
      - Agent
    post:
      operationId: createItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: Item metadata. No secret.
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: agent cannot create items
      summary: Create an item. Secret is in the request over TLS. Never in the response.
        Not MCP.
      tags:
      - Owner
  /v1/import:
    post:
      operationId: importItems
      parameters:
      - description: export.1pux or chrome.csv. Sniffed from bytes when empty.
        explode: true
        in: query
        name: filename
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
          text/csv:
            schema:
              format: binary
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
          description: Created item names. No secrets.
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: agent cannot import
      summary: "One-shot 1Password .1pux or CSV onto origin. Secret in the file, never\
        \ in the response. Not MCP."
      tags:
      - Owner
  /v1/items/{name}:
    delete:
      operationId: deleteItem
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: deleted
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: agent cannot delete items
      summary: Remove the item and its grants. Not MCP.
      tags:
      - Owner
    patch:
      operationId: updateItem
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: Item metadata
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: agent cannot update items
      summary: "Replace URIs, tags, and fill username. No secret."
      tags:
      - Owner
  /v1/items/{name}/archive:
    post:
      operationId: archiveItem
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: archived
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: agent cannot archive items
      summary: Hide from Use and list. History stays.
      tags:
      - Owner
  /v1/grants:
    get:
      operationId: listGrants
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantsResponse"
          description: Grants
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Grants in this org. No secrets. Not MCP.
      tags:
      - Owner
    post:
      operationId: createGrant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGrantRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
          description: Grant
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Grant an agent or a Kratos human Use on an item. Same grant object.
        Not MCP. Not a family vault.
      tags:
      - Owner
  /v1/groups:
    get:
      operationId: listGroups
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsResponse"
          description: Groups
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Org groups. A grant to a group is the shared vault. Not MCP.
      tags:
      - Owner
    post:
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
          description: Group
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Create an org group. Not MCP.
      tags:
      - Owner
  /v1/groups/{name}/members:
    get:
      operationId: listGroupMembers
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMembersResponse"
          description: Members
        "400":
          description: unknown group
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Members of the group — agent or human edges. Not MCP.
      tags:
      - Owner
    post:
      operationId: addGroupMember
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupMemberRequest"
        required: true
      responses:
        "200":
          description: added
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Add an agent or human to the group. Not MCP.
      tags:
      - Owner
  /v1/groups/{name}/members/{kind}/{id}:
    delete:
      operationId: removeGroupMember
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: kind
        required: true
        schema:
          enum:
          - agent
          - human
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: removed
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Remove a member from the group. Not MCP.
      tags:
      - Owner
  /v1/agents:
    get:
      operationId: listAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsResponse"
          description: Agents
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Agents in this org. Ids only. Never secrets. Not MCP.
      tags:
      - Owner
    post:
      operationId: createAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
          description: Agent principal. No secret.
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Register an agent principal. Not a Hydra secret. Not MCP.
      tags:
      - Owner
  /v1/agents/{name}/revoke:
    post:
      operationId: revokeAgent
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
          description: Revoked agent. No token or secret.
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: "Revoke an agent. Idempotent. Kills grants, sessions, and in-flight\
        \ Use. Record stays for audit."
      tags:
      - Owner
  /v1/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
          description: Sessions
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Active sandbox sessions. Metadata only. Never the token. Not MCP.
      tags:
      - Owner
    post:
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
          description: Session plus token once.
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: "Mint a short-lived Use lease onto an existing agent. Token is in this\
        \ response once. Sandbox gets the session file, not the agent JWT. Default\
        \ 15m, max 1h. Not MCP."
      tags:
      - Owner
  /v1/use:
    post:
      operationId: useItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseResponse"
          description: "Decision plus upstream result, scrubbed"
        "400":
          description: bad request
        "401":
          description: missing or invalid Bearer
      summary: Call a URL as this agent. The broker injects the credential. The vault
        secret is never in the response.
      tags:
      - Agent
  /v1/requests:
    get:
      operationId: listRequests
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: open
          enum:
          - open
          - approved
          - denied
          - expired
          - cancelled
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestsResponse"
          description: Requests
        "400":
          description: bad status
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Approval requests filed by level-1 agents. status=open lists only unexpired
        asks. Not MCP.
      tags:
      - Owner
  /v1/requests/stream:
    get:
      operationId: streamRequests
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: text/event-stream; stays open until the client disconnects
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: Server-sent events feed of approval-request changes for the owner org.
        Each event is an empty tick — refetch GET /v1/requests for the authoritative
        rows. Not MCP.
      tags:
      - Owner
  /v1/requests/{id}/approve:
    post:
      operationId: approveRequest
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequestBody"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
          description: The approved request
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
        "404":
          description: no such request in this org
        "409":
          description: already resolved or expired
      summary: Approve an open request — unlocks its level-1 grant for ttl. First
        write wins.
      tags:
      - Owner
  /v1/requests/{id}/deny:
    post:
      operationId: denyRequest
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
          description: The denied request
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
        "404":
          description: no such request in this org
        "409":
          description: already resolved or expired
      summary: Deny an open request. First write wins; the agent's next use files
        a fresh ask.
      tags:
      - Owner
  /v1/events:
    get:
      operationId: listEvents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
          description: Recent events for the Bearer agent
        "401":
          description: missing or invalid Bearer
      summary: "This agent's grant events. Decision, item, action. Never secrets.\
        \ Not MCP."
      tags:
      - Agent
  /v1/report:
    get:
      operationId: vaultReport
      parameters:
      - description: Opt into HaveIBeenPwned k-anonymity breach counts (5-char SHA-1
          prefix only).
        explode: true
        in: query
        name: hibp
        required: false
        schema:
          enum:
          - "1"
          - "true"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultReport"
          description: Health report for the Bearer human's visible items
        "401":
          description: missing or invalid Bearer
        "403":
          description: not a human principal
      summary: "Vault health report — weak, reused, optionally breached passwords\
        \ across items the human can see. Metadata only; never secrets. hibp=1 opts\
        \ into k-anonymity breach lookup."
      tags:
      - Human
  /v1/provision:
    post:
      operationId: provision
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
          description: Provisioned principal
        "401":
          description: missing or invalid human token
      summary: "Signup provisioning. Subject-authenticated — the bearer is a verified\
        \ human ID token, not a member yet. Creates the org, seals the org master\
        \ under the deployment KEK, plants the humans row, and writes the Keto owner/member\
        \ tuples plus the Kratos organization_id stamp. Idempotent; safe to retry.\
        \ Not MCP."
      tags:
      - Human
  /v1/invites:
    post:
      operationId: createInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
          description: Invite result
        "400":
          description: missing email
        "401":
          description: missing or invalid human token
      summary: Private-alpha invite. Owner-authenticated — the bearer is a verified
        human ID token of a provisioned human. Creates the Kratos identity plus recovery
        link under the inviter's org and emails the setup link via the mail worker.
        recovery_url only appears when mail is not configured (local dev). Idempotent
        for re-invites. Not MCP.
      tags:
      - Human
  /v1/members/{id}:
    delete:
      operationId: removeMember
      parameters:
      - description: Kratos identity id of the member
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/removeMember_200_response"
          description: Member removed
        "401":
          description: missing or invalid human token
        "403":
          description: "caller is a member, not an owner"
        "404":
          description: not a member of this org
      summary: Offboard a member. Owner-only — drops the Keto member tuple and the
        humans row; the removed member's token resolves nothing from that call on.
        Owners cannot be removed this way (demote first). Not MCP.
      tags:
      - Human
  /v1/members/{id}/owner:
    delete:
      operationId: demoteOwner
      parameters:
      - description: Kratos identity id of the owner
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/promoteOwner_200_response"
          description: Owner demoted
        "400":
          description: last-owner demotion refused
        "401":
          description: missing or invalid human token
        "403":
          description: "caller is a member, not an owner"
        "404":
          description: not an owner of this org
      summary: Strip the owners tuple from a co-owner. Owner-only. The last owner
        cannot be demoted — the org would have no administrator. Not MCP.
      tags:
      - Human
    post:
      operationId: promoteOwner
      parameters:
      - description: Kratos identity id of the member
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/promoteOwner_200_response"
          description: Member promoted
        "401":
          description: missing or invalid human token
        "403":
          description: "caller is a member, not an owner"
        "404":
          description: not a member of this org
      summary: Grant an existing member the owners tuple. Owner-only. Not MCP.
      tags:
      - Human
  /v1/me:
    delete:
      operationId: deleteMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteMe_200_response"
          description: Account removed from org
        "400":
          description: sole-owner leave refused
        "401":
          description: missing or invalid human token
        "403":
          description: not a provisioned human
      summary: "Leave the org: drops the member (and owner, when present) tuples plus\
        \ the humans row — the token resolves nothing afterward. A sole owner is refused:\
        \ promote a member or delete the org. Not MCP."
      tags:
      - Human
  /v1/org:
    delete:
      operationId: deleteOrg
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteOrg_200_response"
          description: Org purged
        "401":
          description: missing or invalid human token
        "403":
          description: "caller is a member, not an owner"
      summary: "Teardown. Owner-only. Deletes every Keto tuple for the org, then purges\
        \ every vault row (items, grants, sessions, agents, humans, keys) in one transaction.\
        \ Audit rows are kept — teardown must not erase the forensic record. Not MCP."
      tags:
      - Human
  /v1/billing:
    get:
      operationId: getBilling
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingView"
          description: Billing state
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
      summary: "Owner-facing billing state: enforced plan plus this window's use count\
        \ against the free allowance. included is null when metering is off or the\
        \ plan is paid. The vault's cap banner reads this. Not MCP."
      tags:
      - Billing
  /v1/billing/webhook:
    post:
      operationId: billingWebhook
      parameters:
      - description: "t=<ms>,v1=<hex-hmac>"
        explode: false
        in: header
        name: Vortex-Signature
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: {}
        required: true
      responses:
        "204":
          description: accepted (or durable no-op)
        "400":
          description: malformed event body
        "401":
          description: missing or invalid signature
        "404":
          description: billing webhook not configured
        "413":
          description: body too large
      security: []
      summary: Vortex billing webhook receiver. Auth is the Vortex-Signature header
        (HMAC-SHA256 over the raw body) — no org principal. Subscription and entitlement
        lifecycle events flip the org's plan state; unknown event types are durable
        no-ops. Not MCP.
      tags:
      - Billing
  /v1/audit/events:
    get:
      operationId: auditFeed
      parameters:
      - description: Resume cursor — return committed events with id > after.
        explode: true
        in: query
        name: after
        required: false
        schema:
          default: 0
          format: int64
          type: integer
        style: form
      - description: Page size.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 200
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditFeedResponse"
          description: One page of committed org audit events
        "400":
          description: bad after/limit
        "401":
          description: missing or invalid Bearer
        "403":
          description: not the org owner
      summary: "Committed audit feed for this owner’s org — the customer SIEM pull.\
        \ Keyset-paginated: poll with ?after=<next_after> until a short page lands.\
        \ Events queued in the outbox join the feed on relay. Owner-only. Not MCP."
      tags:
      - Audit
  /v1/billing/checkout:
    post:
      operationId: createBillingCheckout
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckout"
          description: Checkout session
        "401":
          description: missing or invalid Bearer
        "403":
          description: not owner
        "404":
          description: billing not configured
        "502":
          description: checkout failed
      summary: "Owner-only upgrade click: mints a fresh hosted Vortex checkout URL\
        \ bound to this org. Checkout tokens are single-use and hash-pinned — never\
        \ cache the URL; mint one per click. The vault's cap-banner Subscribe action.\
        \ Not MCP."
      tags:
      - Billing
  /v1/devices:
    delete:
      operationId: unregisterDevice
      parameters:
      - explode: true
        in: query
        name: token
        required: true
        schema:
          type: string
        style: form
      responses:
        "204":
          description: Device unregistered
        "400":
          description: token required
        "401":
          description: missing or invalid bearer
        "403":
          description: principal is not a human
      summary: "Drop a push token — sign-out and token rotation land here. Idempotent:\
        \ an absent token is already unregistered."
      tags:
      - Human
    post:
      operationId: registerDevice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegisterRequest"
        required: true
      responses:
        "204":
          description: Device registered
        "400":
          description: platform must be apns or fcm and token is required
        "401":
          description: missing or invalid bearer
        "403":
          description: principal is not a human
      summary: Register a push endpoint for the caller's org. The phone app POSTs
        its APNs/FCM token on sign-in and refresh. Humans only — an agent must never
        mint a wake channel for asks meant to reach a human. Idempotent upsert.
      tags:
      - Human
  /v1/items/{name}/rotate:
    post:
      operationId: rotateItem
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateItemRequest"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rotateItem_200_response"
          description: Rotated
        "400":
          description: rotate failed
        "401":
          description: missing or invalid bearer
        "403":
          description: not the owner
        "422":
          description: provider has no key-management API
      summary: "Rotate an item's credential via the provider's key-management API.\
        \ The new secret is verified and sealed in place — item id and grants are\
        \ untouched, agents keep calling Use. Owner-only. 422 when the provider has\
        \ no rotator."
      tags:
      - Owner
  /v1/agents/{name}/bind:
    post:
      operationId: bindWorkload
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindWorkloadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadView"
          description: Workload binding
        "400":
          description: bind failed
        "401":
          description: missing or invalid bearer
        "403":
          description: not the owner
      summary: "Bind an existing agent to an external OIDC issuer, subject, and audience\
        \ (workload identity federation). Owner-only — binding an auth method to an\
        \ agent is a grant-adjacent write."
      tags:
      - Owner
  /v1/workloads/verify-issuer:
    post:
      operationId: verifyIssuer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyIssuerRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyIssuerResponse"
          description: Verification result
        "400":
          description: bad request
        "401":
          description: missing or invalid bearer
        "403":
          description: not the owner
      summary: Dry-run OIDC discovery against an issuer URL before saving a workload
        binding. Owner-only — never mounted on /mcp.
      tags:
      - Owner
  /v1/agents/{name}/workloads:
    delete:
      operationId: unbindWorkload
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: issuer
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: subject
        required: true
        schema:
          type: string
        style: form
      responses:
        "204":
          description: Unbound
        "400":
          description: unbind failed
        "401":
          description: missing or invalid bearer
        "403":
          description: not the owner
      summary: Remove an OIDC workload binding from an agent. Owner-only.
      tags:
      - Owner
    get:
      operationId: listAgentWorkloads
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkloadsResponse"
          description: Workload bindings
        "400":
          description: list workloads failed
        "401":
          description: missing or invalid bearer
        "403":
          description: not the owner
      summary: List bound OIDC workload policies for an agent. Owner-only.
      tags:
      - Owner
  /v1/rotate/providers:
    get:
      operationId: listRotateProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateProvidersResponse"
          description: Rotation provider coverage
        "401":
          description: missing or invalid bearer
        "403":
          description: not the owner
      summary: List zero-touch rotation provider hosts and assisted rotation capability.
        Owner-only.
      tags:
      - Owner
  /v1/items/{name}/verify:
    post:
      operationId: verifyItem
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyItemResponse"
          description: Item verified
        "400":
          description: verify failed
        "401":
          description: missing or invalid bearer
        "403":
          description: not the owner
      summary: "Dry-run an item's credential (outbound WIF exchange, OAuth refresh,\
        \ or provider rotator verify) without revealing the secret. Owner-only."
      tags:
      - Owner
  /v1/items/{name}/rotate-hooks:
    get:
      operationId: listRotateHooks
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateHooksResponse"
          description: Configured hooks
        "400":
          description: no such item
        "401":
          description: missing or invalid bearer
        "403":
          description: not the owner
      summary: List an item's post-rotation fan-outs. Owner only — hook URLs may embed
        capability tokens.
      tags:
      - Owner
    put:
      operationId: setRotateHooks
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateHooksRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateHooksResponse"
          description: Hooks stored
        "400":
          description: invalid hook config
        "401":
          description: missing or invalid bearer
        "403":
          description: not the owner
      summary: "Replace an item's post-rotation fan-out list. Each webhook gets rotation\
        \ metadata (item, rotated_at, key version) — never the secret."
      tags:
      - Owner
  /v1/items/{name}/rotate-hooks/fire:
    post:
      operationId: fireRotateHooks
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateHooksFireResponse"
          description: Per-hook outcomes
        "400":
          description: no such item
        "401":
          description: missing or invalid bearer
        "403":
          description: not the owner
      summary: Re-send the rotation notification to each configured consumer without
        rotating — the retry after a consumer outage. Each firing is audited rotation_hook_fired.
      tags:
      - Owner
  /v1/recovery/share:
    get:
      operationId: getRecoveryShare
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryShare"
          description: Share state
        "401":
          description: missing or invalid human token
      summary: "The caller's own recovery-share state: enrolled flag, pubkey, and\
        \ wrapped_master (ciphertext only — never the plaintext master)."
      tags:
      - Recovery
  /v1/recovery/enroll:
    post:
      operationId: enrollRecovery
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryShare"
          description: The planted share
        "400":
          description: missing or malformed pubkey
        "401":
          description: missing or invalid human token
        "403":
          description: aal1 token — enrollment requires a second factor
        "409":
          description: already enrolled
      summary: "Initial recovery-share enrollment (aal2). Insert-if-absent: a member's\
        \ pubkey never rotates outside the ceremony, so an existing share is a 409."
      tags:
      - Recovery
  /v1/recovery/start:
    post:
      operationId: startRecovery
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRecoveryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartRecoveryResponse"
          description: The request (created=false when deduped)
        "400":
          description: malformed new_pubkey or a pubkey already enrolled on a share
        "401":
          description: missing or invalid human token
        "403":
          description: "non-owner naming another human, or aal1 owner-initiated start"
        "404":
          description: named human is not an org member
        "429":
          description: recovery start rate limit
        "502":
          description: identity plane unavailable
      summary: "Files (or returns the existing open) recovery request. Self-start\
        \ needs no aal2 — a locked-out member may hold only aal1. Owner-initiated\
        \ starts (human_id set) require aal2 + owner. One open request per member:\
        \ a refile returns the live row with created=false and suppresses duplicate\
        \ notifications."
      tags:
      - Recovery
  /v1/recovery:
    get:
      operationId: listRecoveries
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: open
          enum:
          - open
          - completed
          - denied
          - expired
          - cancelled
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveriesResponse"
          description: The org's requests
        "400":
          description: bad status
        "401":
          description: missing or invalid human token
        "403":
          description: not owner or aal1
      summary: Owner-only (aal2) list of org recovery requests filtered by status.
      tags:
      - Recovery
  /v1/recovery/{id}:
    get:
      operationId: getRecovery
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryRequest"
          description: The request
        "401":
          description: missing or invalid human token
        "403":
          description: "not owner, initiator, or target — or aal1 owner"
        "404":
          description: no such request in this org
      summary: "One request. Owners (aal2) get the confirmer view — human_email, current_epoch,\
        \ confirmer_wrapped_master; the initiator or target member gets the bare row."
      tags:
      - Recovery
  /v1/recovery/{id}/complete:
    post:
      operationId: completeRecovery
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRecoveryRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryRequest"
          description: The completed request
        "400":
          description: malformed proof_hmac
        "401":
          description: missing or invalid human token
        "403":
          description: "not owner, aal1, or two-person integrity violation"
        "404":
          description: "no such request, or target was offboarded"
        "409":
          description: already resolved or expired
        "423":
          description: still inside the unlock_at timelock
      summary: "The confirmer's commit (owner, aal2): rotates the org master, re-wraps\
        \ every member share and owner DEK, moves the member's share to the staged\
        \ pubkey at epoch+1, and fires the Kratos MFA reset when reset_mfa was filed.\
        \ Multi-owner orgs enforce two-person integrity. proof_hmac bypasses the sole-owner\
        \ timelock. The MFA reset code never rides the response."
      tags:
      - Recovery
  /v1/recovery/{id}/deny:
    post:
      operationId: denyRecovery
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryRequest"
          description: The resolved request
        "401":
          description: missing or invalid human token
        "403":
          description: "not owner, initiator, or target — or aal1 owner"
        "404":
          description: no such request in this org
        "409":
          description: already resolved
      summary: "Resolve an open request: an owner denies (aal2); the initiator or\
        \ target member cancels at any aal. First write wins."
      tags:
      - Recovery
components:
  schemas:
    Item:
      additionalProperties: false
      example:
        id: id
        org_id: org_id
        name: name
        kind: api_key
        owner:
          kind: kind
          id: id
        uris:
        - uris
        - uris
        tags:
        - tags
        - tags
        archived: true
        has_totp: true
        has_file: true
        login: login
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        kind:
          enum:
          - api_key
          - oauth
          - ssh
          - file
          - passkey
          - card
          - identity
          - secure_note
          - honey
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
        uris:
          items:
            type: string
          type: array
          default: null
        tags:
          items:
            type: string
          type: array
          default: null
        archived:
          type: boolean
        has_totp:
          type: boolean
        has_file:
          type: boolean
        login:
          description: Fill username. Metadata. Not a secret. Empty if unset.
          type: string
      required:
      - id
      - kind
      - name
      - org_id
      - owner
      - uris
    Owner:
      additionalProperties: false
      example:
        kind: kind
        id: id
      properties:
        kind:
          type: string
        id:
          type: string
      required:
      - id
      - kind
    ItemsResponse:
      additionalProperties: false
      example:
        items:
        - id: id
          org_id: org_id
          name: name
          kind: api_key
          owner:
            kind: kind
            id: id
          uris:
          - uris
          - uris
          tags:
          - tags
          - tags
          archived: true
          has_totp: true
          has_file: true
          login: login
        - id: id
          org_id: org_id
          name: name
          kind: api_key
          owner:
            kind: kind
            id: id
          uris:
          - uris
          - uris
          tags:
          - tags
          - tags
          archived: true
          has_totp: true
          has_file: true
          login: login
      properties:
        items:
          items:
            $ref: "#/components/schemas/Item"
          type: array
          default: null
      required:
      - items
    UseRequest:
      additionalProperties: false
      example:
        item: item
        url: url
        method: GET
        headers:
          key: headers
        body: body
        body_b64: body_b64
      properties:
        item:
          description: Granted item name
          type: string
        url:
          description: Absolute URL. Host must match the item.
          type: string
        method:
          default: GET
          type: string
        headers:
          additionalProperties:
            type: string
          description: Extra request headers. Never the vault secret.
        body:
          description: Request body. Never the vault secret. Use --body-file on the
            CLI.
          type: string
        body_b64:
          description: Base64 request body for binary payloads. Takes precedence over
            body. Never the vault secret.
          format: byte
          type: string
      required:
      - item
      - url
    UseResponse:
      additionalProperties: false
      example:
        decision: allow
        reason: reason
        approval_id: approval_id
        request_id: request_id
        request_expires_at: 2000-01-23T04:56:07.000+00:00
        status: 0
        headers:
          key:
          - headers
          - headers
        body: body
        body_b64: body_b64
      properties:
        decision:
          enum:
          - allow
          - deny
          - need_approval
          type: string
        reason:
          type: string
        approval_id:
          type: string
        request_id:
          description: "The filed approval request when decision is need_approval.\
            \ Owners resolve it via /v1/requests/{id}."
          type: string
        request_expires_at:
          description: When the filed ask dies unanswered. Agents may keep retrying
            until then.
          format: date-time
          type: string
        status:
          type: integer
        headers:
          additionalProperties:
            items:
              type: string
          description: "Upstream response headers, including Content-Type and Content-Encoding."
        body:
          description: Upstream body with vault secrets scrubbed. Present when the
            body is valid UTF-8.
          type: string
        body_b64:
          description: "Base64 upstream body with vault secrets scrubbed. Present\
            \ when the body is not valid UTF-8 (gzip, images, protobuf)."
          format: byte
          type: string
      required:
      - decision
    AuditEvent:
      additionalProperties: false
      example:
        time: 2000-01-23T04:56:07.000+00:00
        org_id: org_id
        agent_id: agent_id
        item_id: item_id
        action: action
        decision: allow
        reason: reason
        approval_id: approval_id
      properties:
        time:
          format: date-time
          type: string
        org_id:
          type: string
        agent_id:
          type: string
        item_id:
          type: string
        action:
          type: string
        decision:
          enum:
          - allow
          - deny
          - need_approval
          type: string
        reason:
          type: string
        approval_id:
          type: string
      required:
      - action
      - agent_id
      - decision
      - item_id
      - org_id
      - time
    EventsResponse:
      additionalProperties: false
      example:
        events:
        - time: 2000-01-23T04:56:07.000+00:00
          org_id: org_id
          agent_id: agent_id
          item_id: item_id
          action: action
          decision: allow
          reason: reason
          approval_id: approval_id
        - time: 2000-01-23T04:56:07.000+00:00
          org_id: org_id
          agent_id: agent_id
          item_id: item_id
          action: action
          decision: allow
          reason: reason
          approval_id: approval_id
      properties:
        events:
          items:
            $ref: "#/components/schemas/AuditEvent"
          type: array
          default: null
      required:
      - events
    CreateItemRequest:
      additionalProperties: false
      example:
        name: name
        uri: uri
        uris:
        - uris
        - uris
        tags:
        - tags
        - tags
        kind: api_key
        secret: secret
        totp_seed: totp_seed
        login: login
        card:
          number: number
          exp_month: exp_month
          exp_year: exp_year
          cvv: cvv
          holder: holder
        identity:
          given_name: given_name
          family_name: family_name
          address: address
          city: city
          region: region
          postal: postal
          country: country
          phone: phone
          email: email
        wif:
          token_url: token_url
          assertion_token_url: assertion_token_url
          assertion_client_id: assertion_client_id
          assertion_secret: assertion_secret
          assertion_audience: assertion_audience
          federation_rule_id: federation_rule_id
          organization_id: organization_id
          service_account_id: service_account_id
          workspace_id: workspace_id
      properties:
        name:
          type: string
        uri:
          type: string
        uris:
          items:
            type: string
          type: array
          default: null
        tags:
          items:
            type: string
          type: array
          default: null
        kind:
          enum:
          - api_key
          - oauth
          - ssh
          - file
          - passkey
          - card
          - identity
          - secure_note
          - honey
          type: string
        secret:
          description: Vault material. Request only. Never returned.
          type: string
        totp_seed:
          description: TOTP seed. Request only. Never returned.
          type: string
        login:
          description: Fill username. Metadata on the item. Also sealed in the envelope.
            Not a secret.
          type: string
        card:
          $ref: "#/components/schemas/CardFields"
        identity:
          $ref: "#/components/schemas/IdentityFields"
        wif:
          $ref: "#/components/schemas/WIFItemFields"
      required:
      - name
    UpdateItemRequest:
      additionalProperties: false
      example:
        uri: uri
        uris:
        - uris
        - uris
        tags:
        - tags
        - tags
        login: login
        secret: secret
      properties:
        uri:
          description: Add this autofill host. Does not drop existing hosts.
          type: string
        uris:
          description: Replace autofill hosts with this list.
          items:
            type: string
          type: array
          default: null
        tags:
          items:
            type: string
          type: array
          default: null
        login:
          description: Fill username. Metadata on the item. Also sealed in the envelope.
          type: string
        secret:
          description: "Rotate the sealed secret — a changed password. TOTP seed,\
            \ login, and passkey survive. Blank refuses; absent leaves the secret\
            \ alone."
          type: string
    CreateGrantRequest:
      additionalProperties: false
      example:
        agent: agent
        human: human
        item: item
        level: level1
        expires: expires
        group: group
      properties:
        agent:
          description: Agent id. XOR human/group.
          type: string
        human:
          description: Kratos identity id. Same Grant.agent_id. Not email. XOR agent/group.
          type: string
        item:
          type: string
        level:
          enum:
          - level1
          - level2
          type: string
        expires:
          description: Go duration. Empty is forever.
          type: string
        group:
          description: Org group name — the shared vault. XOR agent/human.
          type: string
      required:
      - item
      - level
    Grant:
      additionalProperties: false
      example:
        id: id
        org_id: org_id
        agent_id: agent_id
        item_id: item_id
        level: level
        expires_at: 2000-01-23T04:56:07.000+00:00
        subject_kind: agent
      properties:
        id:
          type: string
        org_id:
          type: string
        agent_id:
          type: string
        item_id:
          type: string
        level:
          type: string
        expires_at:
          format: date-time
          type: string
        subject_kind:
          description: Subject kind. agent_id holds the subject id — the group id
            when subject_kind is group.
          enum:
          - agent
          - human
          - group
          type: string
      required:
      - agent_id
      - id
      - item_id
      - level
      - org_id
      - subject_kind
    GrantsResponse:
      additionalProperties: false
      example:
        grants:
        - id: id
          org_id: org_id
          agent_id: agent_id
          item_id: item_id
          level: level
          expires_at: 2000-01-23T04:56:07.000+00:00
          subject_kind: agent
        - id: id
          org_id: org_id
          agent_id: agent_id
          item_id: item_id
          level: level
          expires_at: 2000-01-23T04:56:07.000+00:00
          subject_kind: agent
      properties:
        grants:
          items:
            $ref: "#/components/schemas/Grant"
          type: array
          default: null
      required:
      - grants
    Agent:
      additionalProperties: false
      example:
