title = "Veil gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "PostHog project API keys are write-only public tokens — they ship in client bundles by design and cannot read data."
regexes = ['''phc_[A-Za-z0-9_-]{20,80}''']

[[allowlists]]
description = "EAS submit ASC key/issuer IDs are public identifiers, not credentials — the signing secret is the .p8 which never lands in the repo."
paths = ['''apps/phone/eas\.json''']
